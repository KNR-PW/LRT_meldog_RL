name: lint

# Runs the same pre-commit hooks the local hook runs, so nothing can land that the gate would have
# blocked. Isaac Lab is not installed here: these hooks only parse the project, never import it,
# so no GPU and no Isaac Sim are needed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: pre-commit/action@v3.0.1
