# Safety hooks only (2026-09-13). Formatting and lint (black, flake8, isort, ...) are
# left out until the codebase gets one deliberate formatting commit.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # files over 2 MB must go through git-lfs
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]  # Isaac Lab env.yaml dumps use !!python tags; check syntax only
      - id: check-toml
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict
