# Safety hooks, a correctness gate, and formatting (2026-09-19).
#
# The gate is every pyflakes check plus syntax errors: undefined names, unused imports, unused
# locals, f-strings with nothing to interpolate. It exists because an undefined name read inside a
# rarely-taken branch silently cost a night of benchmark runs -- the script crashed while writing
# its output and Isaac Sim still exited 0, so the runner recorded a success.
#
# Imports kept for their side effect (importing meldog_rl.envs registers the Gym task ids) are
# marked `# noqa: F401` at the import, with a comment above the block saying why.
#
# black and isort own formatting; line length is 100 and the settings live in pyproject.toml.
# "legacy code structure" is a snapshot kept for debugging comparisons: no hook touches it, so it
# stays byte-identical to the code it was copied from. logs/ and datasets/ are not tracked anyway.
exclude: '^(legacy code structure/|logs/|datasets/|literature/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2000"]  # files over 2 MB must go through git-lfs
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--unsafe"]  # Isaac Lab env.yaml dumps use !!python tags; check syntax only
      - id: check-toml
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-case-conflict

  # --- correctness gate: runs on every commit -------------------------------------------------
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        name: flake8 (pyflakes checks and syntax errors)
        args: ["--select=E9,F", "--show-source"]
        additional_dependencies: ["flake8-bugbear==24.10.31"]

  # --- formatting -----------------------------------------------------------------------------
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        args: ["--py310-plus"]
